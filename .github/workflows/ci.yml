name: keycloak-native-auth

# One workflow for every package. The `changes` job decides which parts a pull request touches and each
# job runs only for its parts; pushes to main, the nightly run and manual runs build everything. Branch
# protection requires only `CI passed`, which fails if any job that ran failed. A skipped job counts as
# passed, so docs-only pull requests aren't left waiting, and adding a job needs no protection change.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

defaults:
  run:
    working-directory: keycloak-native-auth

jobs:
  changes:
    name: Changed parts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      server: ${{ steps.parts.outputs.server }}
      ios: ${{ steps.parts.outputs.ios }}
      android: ${{ steps.parts.outputs.android }}
      flutter: ${{ steps.parts.outputs.flutter }}
      react-native: ${{ steps.parts.outputs.react-native }}
    steps:
      - uses: actions/checkout@v4
      - name: Map changed paths to parts
        id: parts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The transcripts are the contract between the server and every client, and this workflow
          # file changes how everything is checked: both count as a change to every part.
          if [ "$EVENT" = pull_request ]; then
            files=$(gh pr diff "$PR" --name-only)
          else
            files="*"
          fi
          echo "$files"
          part() { # name, extended regexp over the changed paths, directory that must exist
            if [ -n "$3" ] && [ ! -d "$3" ]; then
              hit=false
            elif [ "$files" = "*" ] || grep -qE "$2|^keycloak-native-auth/demo/transcripts/|^\.github/workflows/ci\.yml$" <<<"$files"; then
              hit=true
            else
              hit=false
            fi
            echo "$1=$hit" | tee -a "$GITHUB_OUTPUT"
          }
          part server '^keycloak-native-auth/'
          part ios '^ios/|^Package\.(swift|resolved)$'
          part android '^android/'
          # The wrappers build the native SDKs from the repository, so SDK changes rebuild them too.
          part flutter '^flutter/|^ios/|^android/|^Package\.(swift|resolved)$' flutter
          part react-native '^react-native/|^ios/|^android/|^Package\.(swift|resolved)$' react-native

  build-and-test:
    # One build (compiled against the newest supported Keycloak, keycloak.version in the POM) is
    # tested against a stock container of every supported minor (README "Keycloak versions").
    needs: changes
    if: needs.changes.outputs.server == 'true'
    name: Build, unit tests, integration tests (Testcontainers, Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.8.1", "26.6.4", "26.4.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + unit tests + integration tests
        run: mvn -B --no-transfer-progress verify -Dkeycloak.image=quay.io/keycloak/keycloak:${{ matrix.keycloak }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.keycloak }}
          path: |
            keycloak-native-auth/**/target/surefire-reports/*.txt
            keycloak-native-auth/**/target/failsafe-reports/*.txt
          if-no-files-found: ignore

  walkthrough:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    name: docker compose up + walkthrough.sh (definition of done)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build provider JARs
        run: mvn -B --no-transfer-progress -DskipTests -DskipITs package
      - name: Start Keycloak + Postgres
        working-directory: keycloak-native-auth/demo
        # The container's keycloak user (uid 1000) must be able to read the bind-mounted files.
        run: |
          chmod -R a+rX target/providers realm-export
          docker compose up --wait
      - name: Run the curl walkthrough (username -> password -> totp -> code -> token)
        working-directory: keycloak-native-auth/demo
        run: ./scripts/walkthrough.sh
      - name: Keycloak logs
        if: always()
        working-directory: keycloak-native-auth/demo
        run: docker compose logs keycloak | tail -n 200
      - name: Stop
        if: always()
        working-directory: keycloak-native-auth/demo
        run: docker compose down -v

  ios-sdk:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    name: Swift package build + tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        # The Swift package manifest is at the repository root (sources under ios/KeycloakNative).
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build + tests (transcript replay from keycloak-native-auth/demo/transcripts)
        run: swift build && swift test
      - name: Example app package type-checks
        working-directory: ios/KeycloakNativeDemo
        run: swift build
      - name: "Example app + XCUITests compile for the iOS simulator (not run: they need the compose stack)"
        working-directory: ios/KeycloakNativeDemo
        run: xcodebuild -project KeycloakNativeDemo.xcodeproj -scheme KeycloakNativeDemo -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY="-" build-for-testing | tail -n 20

  android-core:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    name: Android SDK (core transcript replay, android and ui module builds, ui model tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build + tests (transcript replay from keycloak-native-auth/demo/transcripts)
        run: ./gradlew --no-daemon --console=plain :core:build
      # The runner image has the Android SDK with its licenses accepted; AGP downloads a missing platform.
      - name: Android, ui and push modules and the demo app (libraries + instrumentation test APKs; the instrumentation tests themselves need an emulator; the demo builds without Firebase config)
        run: ./gradlew --no-daemon --console=plain :android:assembleRelease :android:assembleDebugAndroidTest :ui:assembleRelease :ui:assembleDebugAndroidTest :push:assembleRelease :demo:assembleDebug
      - name: ui model and push tests (JVM)
        run: ./gradlew --no-daemon --console=plain :ui:testDebugUnitTest :push:testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-test-reports
          path: |
            android/core/build/reports/tests/
            android/ui/build/reports/tests/
            android/push/build/reports/tests/

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    name: Flutter plugin (analyze, tests with transcript replay, example APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter/keycloak_native_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated channel code is up to date
        run: dart run pigeon --input pigeons/messages.dart && git diff --exit-code -- lib/src/messages.g.dart android/src/main/kotlin ios/keycloak_native_flutter/Sources
      - run: flutter analyze
      - name: Tests (model, transcript replay from keycloak-native-auth/demo/transcripts, widgets)
        run: flutter test
      - name: Example APK (compiles the Android SDK from ../android through the Gradle composite build)
        working-directory: flutter/keycloak_native_flutter/example
        run: flutter build apk --debug

  flutter-ios:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    name: Flutter plugin (example app for the iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter/keycloak_native_flutter/example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Example app for the simulator (compiles the iOS SDK through the local Swift package)
        run: flutter build ios --simulator --debug --no-codesign

  react-native:
    needs: changes
    if: needs.changes.outputs.react-native == 'true'
    name: React Native module (typecheck, lint, Jest transcript replay, example app Android build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: react-native/keycloak-native-react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: react-native/keycloak-native-react-native/.nvmrc
      - name: Install (Yarn 4 from .yarn/releases, workspaces with the example app)
        run: yarn install --immutable
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Jest (model, controller, screens; replays keycloak-native-auth/demo/transcripts through a mock native module)
        run: yarn test --ci
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Example app (assembleDebug; the Android SDK is built from ../../android through a composite build)
        working-directory: react-native/keycloak-native-react-native/example/android
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug -PreactNativeArchitectures=x86_64

  react-native-ios:
    needs: changes
    if: needs.changes.outputs.react-native == 'true'
    name: React Native module (example app for the iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: react-native/keycloak-native-react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: react-native/keycloak-native-react-native/.nvmrc
      - name: Install (Yarn 4 from .yarn/releases, workspaces with the example app)
        run: yarn install --immutable
      - name: Pods (the module's Swift package dependency resolves to this checkout's Package.swift)
        working-directory: react-native/keycloak-native-react-native/example/ios
        run: RCT_NEW_ARCH_ENABLED=1 pod install
      - name: Example app for the simulator
        working-directory: react-native/keycloak-native-react-native/example/ios
        run: xcodebuild -workspace ReactNativeKeycloakNativeExample.xcworkspace -scheme ReactNativeKeycloakNativeExample -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 20

  react-native-floor:
    # The oldest supported React Native (spec/19 "Floor"): a fresh template app with the module from `npm pack`,
    # the Android SDK from this checkout's Maven publication and the Swift package from this checkout.
    needs: changes
    if: needs.changes.outputs.react-native == 'true'
    name: React Native module on its oldest supported version (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: react-native/keycloak-native-react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: react-native/keycloak-native-react-native/.nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build the floor app
        run: scripts/floor-build.sh ${{ matrix.platform }} "$RUNNER_TEMP/rn-floor"

  ci-passed:
    # The only required status check on main. Add every new job to `needs`.
    name: CI passed
    if: always()
    needs: [changes, build-and-test, walkthrough, ios-sdk, android-core, flutter, flutter-ios, react-native, react-native-ios, react-native-floor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job that ran succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
