name: keycloak-native-auth

on:
  push:
    branches: [main]
    paths:
      - "keycloak-native-auth/**"
      - "ios/**"
      - "android/**"
      - "react-native/**"
      - "Package.swift"
      - ".github/workflows/ci.yml"
  # Every pull request, docs-only ones too: the six jobs are required checks on main, and a
  # filtered-out run would leave the PR waiting for them forever.
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: keycloak-native-auth

jobs:
  build-and-test:
    # One build (compiled against the newest supported Keycloak, keycloak.version in the POM) is
    # tested against a stock container of every supported minor (README "Keycloak versions").
    name: Build, unit tests, integration tests (Testcontainers, Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        keycloak: ["26.8.1", "26.6.4", "26.4.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build + unit tests + integration tests
        run: mvn -B --no-transfer-progress verify -Dkeycloak.image=quay.io/keycloak/keycloak:${{ matrix.keycloak }}
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.keycloak }}
          path: |
            keycloak-native-auth/**/target/surefire-reports/*.txt
            keycloak-native-auth/**/target/failsafe-reports/*.txt
          if-no-files-found: ignore

  walkthrough:
    name: docker compose up + walkthrough.sh (definition of done)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build provider JARs
        run: mvn -B --no-transfer-progress -DskipTests -DskipITs package
      - name: Start Keycloak + Postgres
        working-directory: keycloak-native-auth/demo
        # The container's keycloak user (uid 1000) must be able to read the bind-mounted files.
        run: |
          chmod -R a+rX target/providers realm-export
          docker compose up --wait
      - name: Run the curl walkthrough (username -> password -> totp -> code -> token)
        working-directory: keycloak-native-auth/demo
        run: ./scripts/walkthrough.sh
      - name: Keycloak logs
        if: always()
        working-directory: keycloak-native-auth/demo
        run: docker compose logs keycloak | tail -n 200
      - name: Stop
        if: always()
        working-directory: keycloak-native-auth/demo
        run: docker compose down -v

  ios-sdk:
    name: Swift package build + tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        # The Swift package manifest is at the repository root (sources under ios/KeycloakNative).
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build + tests (transcript replay from keycloak-native-auth/demo/transcripts)
        run: swift build && swift test
      - name: Example app package type-checks
        working-directory: ios/KeycloakNativeDemo
        run: swift build
      - name: "Example app + XCUITests compile for the iOS simulator (not run: they need the compose stack)"
        working-directory: ios/KeycloakNativeDemo
        run: xcodebuild -project KeycloakNativeDemo.xcodeproj -scheme KeycloakNativeDemo -destination 'generic/platform=iOS Simulator' CODE_SIGN_IDENTITY="-" build-for-testing | tail -n 20

  android-core:
    # The name is a required status check on main (branch protection); renaming it needs the rule updated too.
    name: Android SDK (core transcript replay, android and ui module builds, ui model tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build + tests (transcript replay from keycloak-native-auth/demo/transcripts)
        run: ./gradlew --no-daemon --console=plain :core:build
      # The runner image has the Android SDK with its licenses accepted; AGP downloads a missing platform.
      - name: Android, ui and push modules and the demo app (libraries + instrumentation test APKs; the instrumentation tests themselves need an emulator; the demo builds without Firebase config)
        run: ./gradlew --no-daemon --console=plain :android:assembleRelease :android:assembleDebugAndroidTest :ui:assembleRelease :ui:assembleDebugAndroidTest :push:assembleRelease :demo:assembleDebug
      - name: ui model and push tests (JVM)
        run: ./gradlew --no-daemon --console=plain :ui:testDebugUnitTest :push:testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-test-reports
          path: |
            android/core/build/reports/tests/
            android/ui/build/reports/tests/
            android/push/build/reports/tests/

  react-native:
    # Not a required check: it is new (spec/19 §9), and a branch protection rule names required jobs.
    name: React Native module (typecheck, lint, Jest transcript replay, example app Android build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: react-native/keycloak-native-react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: react-native/keycloak-native-react-native/.nvmrc
      - name: Install (Yarn 4 from .yarn/releases, workspaces with the example app)
        run: yarn install --immutable
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Jest (model, controller, screens; replays keycloak-native-auth/demo/transcripts through a mock native module)
        run: yarn test --ci
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Example app (assembleDebug; the Android SDK is built from ../../android through a composite build)
        working-directory: react-native/keycloak-native-react-native/example/android
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug -PreactNativeArchitectures=x86_64
