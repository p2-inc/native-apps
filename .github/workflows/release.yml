# Attaches the build outputs to a GitHub release when it is published (README "Releases"):
#   keycloak-native-auth-providers-<tag>.zip   the Keycloak provider jars for /opt/keycloak/providers
#   keycloak-native-android-<tag>-maven-repo.zip   the Android SDK as a Maven repository, also published to Maven Central
# Swift packages need nothing here: SwiftPM resolves the tag itself.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to
        required: true

permissions:
  contents: write

jobs:
  assets:
    name: Build and attach release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Keycloak providers
        working-directory: keycloak-native-auth
        run: |
          mvn -B --no-transfer-progress versions:set -DnewVersion="$TAG" -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress -DskipTests -DskipITs package
          mkdir -p ../dist/providers
          cp demo/target/providers/*.jar COPYING ../dist/providers/
          cp push-mfa-extension-java21/LICENSE ../dist/providers/LICENSE-keycloak-push-mfa-extension
          cp push-mfa-extension-java21/NOTICE ../dist/providers/NOTICE-keycloak-push-mfa-extension
          (cd ../dist/providers && zip -q -r "../keycloak-native-auth-providers-$TAG.zip" .)
      # The org's Maven Central signing key, stored base64-encoded for the Maven extension releases;
      # Gradle's in-memory signing wants it ASCII-armored.
      - name: Signing key
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: |
          echo "$GPG_KEY" | base64 -d | gpg --batch --import
          {
            echo "SIGNING_KEY<<EOF"
            gpg --batch --armor --export-secret-keys
            echo "EOF"
          } >> "$GITHUB_ENV"
      # The runner image has the Android SDK with its licenses accepted.
      - name: Android SDK Maven repository
        working-directory: android
        run: |
          ./gradlew --no-daemon --console=plain -PreleaseVersion="$TAG" :core:test publishAllPublicationsToReleaseRepository
          (cd build/maven-repo && zip -q -r "../../../dist/keycloak-native-android-$TAG-maven-repo.zip" .)
      - name: Upload to the release
        run: gh release upload "$TAG" dist/*.zip --clobber
      # Central Portal publisher API: a bundle of the signed repository layout, published automatically once it
      # validates. Central keeps every version forever, so this runs last, after the GitHub assets are attached.
      - name: Publish the Android SDK to Maven Central
        working-directory: android/build/maven-repo
        env:
          CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          zip -q -r ../central-bundle.zip . -x '*maven-metadata*'
          auth="Authorization: Bearer $(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          id=$(curl -sSf -H "$auth" -F "bundle=@../central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=keycloak-native-android-$TAG&publishingType=AUTOMATIC")
          echo "Deployment $id"
          for _ in $(seq 60); do
            state=$(curl -sSf -X POST -H "$auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -r .deploymentState)
            echo "$state"
            case "$state" in
              PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) curl -sS -X POST -H "$auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq .errors; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for validation"; exit 1
