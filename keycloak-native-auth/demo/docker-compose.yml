# Keycloak 26.8.1 + Postgres with the native-auth providers and the demo realm.
#
#   mvn -f ../pom.xml -DskipTests -DskipITs package   # builds ./target/providers/*.jar
#   docker compose up --wait                           # KC_PORT=8089 docker compose up --wait  to use another host port
#   ./scripts/walkthrough.sh                           # KC_BASE=http://localhost:8089 ./scripts/walkthrough.sh
#
# Admin console: http://localhost:${KC_PORT:-8080}/admin (admin / admin); email OTP inbox: http://localhost:${MAILPIT_PORT:-8025};
# step-up demo API: http://localhost:${RS_PORT:-8091}/transfer (set RS_EXTRA_ISSUERS=",https://<tunnel-host>/realms/demo" behind a tunnel)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    # Email OTP inbox (spec/06 S4): UI + API http://localhost:${MAILPIT_PORT:-8025}, SMTP mailpit:1025 (realm smtpServer).
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  resource-server:
    # Step-up demo API (spec/06 S6): GET /me, GET /transfer (401 insufficient_user_authentication below acr 2).
    # Tokens are validated against Keycloak's JWKS; the issuer the app sees must match ISSUER_PUBLIC.
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    environment:
      PORT: "8091"
      ISSUER: "http://keycloak:8080/realms/demo"
      ISSUER_PUBLIC: "http://localhost:${KC_PORT:-8080}/realms/demo${RS_EXTRA_ISSUERS:-}"
      PUBLIC_BASE: "http://localhost:${RS_PORT:-8091}"
      REQUIRED_ACR: "2"
    volumes:
      - ./resource-server/server.mjs:/srv/server.mjs:ro
    ports:
      - "${RS_PORT:-8091}:8091"
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    # Keep in sync with keycloak.version in ../pom.xml (spec/08 Q4).
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_LOG_LEVEL: "info,io.phasetwo.keycloak.nativeauth:debug,de.arbeitsagentur.keycloak.push:debug"
      # Push MFA (spec/14 D9/D10): the APNs sender stays unconfigured unless these are set in the host
      # environment (an Apple team, a .p8 key and the app's bundle id); devices enrolled with
      # pushProviderType "none" or "log" work without them (the app pulls pending approvals).
      KC_SPI_PUSH_NOTIFICATION_SENDER__APNS__TEAM_ID: "${APNS_TEAM_ID:-}"
      KC_SPI_PUSH_NOTIFICATION_SENDER__APNS__KEY_ID: "${APNS_KEY_ID:-}"
      KC_SPI_PUSH_NOTIFICATION_SENDER__APNS__KEY: "${APNS_KEY:-}"
      KC_SPI_PUSH_NOTIFICATION_SENDER__APNS__TOPIC: "${APNS_TOPIC:-io.phasetwo.keycloak.nativedemo}"
      KC_SPI_PUSH_NOTIFICATION_SENDER__APNS__ENVIRONMENT: "${APNS_ENVIRONMENT:-sandbox}"
    ports:
      - "${KC_PORT:-8080}:8080"
    volumes:
      - ./target/providers:/opt/keycloak/providers:ro
      - ./realm-export:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # The image has no curl/wget; use bash's /dev/tcp against the management port.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
